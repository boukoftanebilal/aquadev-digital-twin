<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquaDev shrimp farm — digital twin</title>
<meta name="description" content="Monitoring twin of the AquaDev Abu Dhabi shrimp farm: 28 grow-out tanks, water treatment, production KPIs, energy and alarms.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="app">
  <aside class="tb" aria-label="Project and navigation">
    <div class="tb-cell tb-brand">
      <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect x="3" y="3" width="34" height="34" rx="9" fill="none" stroke="#7a2331" stroke-width="4"/><rect x="9.5" y="9.5" width="21" height="21" rx="5" fill="#3f8fa3"/><circle cx="20" cy="20" r="2.4" fill="#fff"/></svg>
      <div><strong>AquaDev Abu Dhabi</strong><span>Shrimp farm twin</span></div>
    </div>
    <div class="tb-cell"><label>Project name :</label><p>Shrimp farm, grow-out pilot</p></div>
    <div class="tb-cell"><label>Owner :</label><p>Aqua Development Ltd. / AD Ports Group</p></div>
    <div class="tb-cell tb-two"><div><label>Sector :</label><p>Al Sajaa</p></div><div><label>Plot :</label><p>8</p></div></div>
    <nav class="tb-cell tb-nav" id="nav" aria-label="Views">
      <label>Sheet :</label>
      <button data-view="twin" class="on">Digital twin</button>
      <button data-view="tanks">Tanks</button>
      <button data-view="water">Water</button>
      <button data-view="production">Production and KPIs</button>
      <button data-view="energy">Energy and climate</button>
      <button data-view="alarms">Alarms and log</button>
      <button data-view="facility">Facility</button>
      <button data-view="data">Data connections</button>
    </nav>
    <div class="tb-cell tb-src"><label>Data source :</label><p><span class="sim-dot"></span>Simulated telemetry</p><small>No sensors connected. See Data connections.</small></div>
    <div class="tb-cell tb-two"><div><label>Drawings :</label><p>Rev 01</p></div><div><label>Dated :</label><p>01-11-2025</p></div></div>
  </aside>

  <div class="main">
    <header class="top">
      <h1 id="view-title">Digital twin</h1>
      <div class="clock">
        <div class="clock-t"><span id="clock-tag" class="tag live">Live</span><b id="clock">—</b><small>Gulf Standard Time</small></div>
        <label class="scrub">Twin clock, hours from now<input id="scrub" type="range" min="-720" max="720" step="1" value="0" aria-label="Move the twin clock up to 30 days back or forward"></label>
        <div class="seg" id="speed" role="group" aria-label="Clock speed">
          <button data-live="1" title="Return to the present">Now</button>
          <button data-speed="1" class="on" title="Real time">1×</button>
          <button data-speed="600" title="Ten minutes per second">10 min/s</button>
          <button data-speed="21600" title="Six hours per second">6 h/s</button>
        </div>
        <button class="alarm-btn" id="alarm-btn" title="Open alarms"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 2a5 5 0 0 0-5 5v3.5L3.5 14h13L15 10.5V7a5 5 0 0 0-5-5zm-2 14a2 2 0 0 0 4 0z" fill="currentColor"/></svg><b>0</b><span>alarms</span></button>
      </div>
    </header>

    <section class="view twin" id="v-twin">
      <div id="twin-host"></div>
      <div class="twin-tools">
        <label class="fld">Colour tanks by<select id="color-by"></select></label>
        <div id="legend"></div>
        <details class="pop"><summary>Layers</summary><div id="layers" class="checks"></div></details>
        <div class="cams" id="views" role="group" aria-label="Camera">
          <button data-cam="iso">Overview</button><button data-cam="plan">Plan</button><button data-cam="aisle">Walk the aisle</button><button data-cam="wt">Water treatment</button><button data-cam="rooms">Service rooms</button>
        </div>
      </div>
      <div class="ribbon" id="ribbon"></div>
      <aside class="inspector" id="inspector" aria-live="polite"></aside>
    </section>
    <section class="view page" id="v-tanks" hidden></section>
    <section class="view page" id="v-water" hidden></section>
    <section class="view page" id="v-production" hidden></section>
    <section class="view page" id="v-energy" hidden></section>
    <section class="view page" id="v-alarms" hidden></section>
    <section class="view page" id="v-facility" hidden></section>
    <section class="view page" id="v-data" hidden></section>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
